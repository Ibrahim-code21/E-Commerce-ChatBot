<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSense AI — Your Smart Shopping Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <div class="app-wrapper">

      
        <aside class="sidebar">
            <div class="sidebar-logo">
                <span class="logo-icon">✦</span>
                <span class="logo-text">ShopSense</span>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item active" onclick="newChat()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                    New Chat
                </button>
                <button class="nav-item" onclick="showSuggestions()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    Browse Products
                </button>
                <button class="nav-item" onclick="showFAQ()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></svg>
                    FAQ
                </button>
            </nav>

            <div class="sidebar-history" id="chat-history">
                <p class="history-label">Recent</p>
            </div>

            <div class="sidebar-footer">
                <div class="store-status">
                    <span class="status-dot"></span>
                    Store is open
                </div>
            </div>
        </aside>

        <main class="main-area">

            <header class="topbar">
                <button class="topbar-btn" id="sidebar-toggle" onclick="toggleSidebar()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <span class="topbar-title" id="topbar-title">New Conversation</span>
                <button class="topbar-btn" onclick="clearChat()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                </button>
            </header>

            <div class="chat-area" id="chat-area">

                <div class="welcome-screen" id="welcome-screen">
                    <h1 class="welcome-title">How can I help you shop today?</h1>
                    <p class="welcome-sub">Ask me anything — I know our products, prices, policies, and more.</p>

                    <div class="suggestion-chips">
                        <button class="chip" onclick="useChip(this)">What's your return policy?</button>
                        <button class="chip" onclick="useChip(this)">Show me wireless headphones</button>
                        <button class="chip" onclick="useChip(this)">Do you offer free shipping?</button>
                        <button class="chip" onclick="useChip(this)">Best laptop under $1000?</button>
                        <button class="chip" onclick="useChip(this)">How do I track my order?</button>
                        <button class="chip" onclick="useChip(this)">What payment methods do you accept?</button>
                    </div>
                </div>

                <div class="messages" id="messages"></div>

            </div>

            <div class="input-wrapper">
                <div class="input-box">
                    <textarea
                        id="user-input"
                        placeholder="Ask about products, shipping, returns..."
                        rows="1"
                        onInput="autoResize(this)"
                        onKeyDown="handleKey(event)"
                    ></textarea>
                    <button class="send-btn" id="send-btn" onclick="sendMessage()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </div>
                <p class="input-hint">ShopSense AI can make mistakes. Verify important information.</p>
            </div>

        </main>
    </div>

    <script src="/static/chat.js"></script>
</body>
</html>
